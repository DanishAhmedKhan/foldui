<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldUI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

</head>

<body>

    <div id="container"></div>

    <script type="module">

        import { Fold } from './src/index'

        Fold.addComponent({
            name: "section",
            props: {
            },
            render: ({ props }) => {
            }
        })

        Fold.addComponent({
            name: "text",
            props: {
                content: { type: "string", default: "This is a text" }
            },
            defaultStyle: {
                fontSize: '30px',
            },
            render: ({ props }) => {
                const el = document.createElement("span")
                el.textContent = props.content
                return el
            }
        })

        Fold.addComponent({
            name: "button",
            props: {
                label: { type: "string", default: "Button" }
            },
            render: ({ props }) => {
                const el = document.createElement("button")
                el.textContent = props.label
                return el
            }
        })

        Fold.addComponent({
            name: "container",
            props: {
                layout: {
                    type: "object",
                    defaultVariant: "flex",
                    variants: {
                        flex: {
                            align: { type: "string", default: "center" },
                            justify: { type: "string", default: "center" }
                        },
                        grid: {
                            columns: { type: "number", default: 3 },
                            gap: { type: "number", default: 10 }
                        }
                    }
                }
            },
            render: ({ props, children }) => {
                const el = document.createElement("div")

                if (props.layout?.type === "flex") {
                    el.style.display = "flex"
                    el.style.alignItems = props.layout.align
                    el.style.justifyContent = props.layout.justify
                }

                if (props.layout?.type === "grid") {
                    el.style.display = "grid"
                    el.style.gridTemplateColumns = `repeat(${props.layout.columns}, 1fr)`
                    el.style.gap = `${props.layout.gap}px`
                }

                children?.forEach(child => el.appendChild(child))
                return el
            }
        })

        const schema = {
            id: "root",
            type: "container",
            props: {},
            children: [
                {
                    id: "t1",
                    type: "text",
                    props: { content: "Hello FoldUI" },
                    style: {
                        // fontSize: '30px',
                        color: 'red',
                    }
                },
            ]
        }

        const html = Fold.render(schema)

        const containerEl = document.getElementById('container')
        containerEl.appendChild(html)

    </script>

</body>

</html>
