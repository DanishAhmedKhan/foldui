<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldUI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

</head>

<body>

    <div id="container"></div>

    <script type="module">

        import { Fold } from './src/index'

        const schema = {
            type: 'section',
            style: {
                background: '#eeebff',
            },
            children: [
                {
                    id: "root",
                    type: "container",
                    props: {
                        layout: {
                            type: 'flex',
                            // clumn: 2,
                            // gap: 50
                        }
                    },
                    style: {
                        margin: '0 auto',
                        width: '100%',
                        maxWidth: '1200px'
                    },
                    children: [
                        {
                            id: 'asdg',
                            type: 'container',
                            props: {
                                layout: {
                                    type: 'flex',
                                    direction: 'vertical',
                                    justify: 'center',
                                    align: 'flex-start',
                                }
                            },
                            children: [
                                {
                                    id: "t1",
                                    type: "text",
                                    props: {
                                        content: "The best amazing menu builder that converts and is well structured. Analytics and SEO included.",
                                        tag: 'h1',
                                    },
                                    style: {
                                        fontSize: '20px',
                                        marginBottom: '30px'
                                    }
                                },
                                {
                                    id: "b1",
                                    type: "button",
                                    props: { label: "Click Me!" },
                                },
                            ]
                        },
                        {
                            id: 'jvoiwe',
                            type: 'container',
                            children: [
                                {
                                    id: "i1",
                                    type: "image",
                                    props: {
                                        src: "https://www.lamborghini.com/sites/it-en/files/DAM/lamborghini/news/2026/01_23_alps/cover.jpg",
                                        alt: 'car'
                                    },
                                },
                            ]
                        },

                    ]
                }
            ],
        }

        const plusIcon = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>'

        const schema2 = {
            id: "b1",
            type: 'button',
            props: {
                label: "Click Me",
                icon: {
                    content: plusIcon,
                    position: "left",
                }
            },
            style: {
                button: {
                    // background: 'red'
                },
            },
            responsive: {
                mobile: {
                    style: {
                        button: {
                            background: 'blue'
                        }
                    },
                    prop: {
                        icon: {
                            position: "right"
                        }
                    }
                }
            }
        }

        const html = Fold.render(schema2)

        const containerEl = document.getElementById('container')
        containerEl.appendChild(html)

    </script>

</body>

</html>
