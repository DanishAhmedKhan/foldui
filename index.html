<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldUI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

</head>

<body>

    <div id="container"></div>

    <script type="module">

        import { Fold } from './src/index'

        Fold.addComponent({
            name: "text",
            allowChildren: false,
            props: {
                content: { type: "string", default: "" }
            },
            render: ({ props }) => {
                const el = document.createElement("span")
                el.textContent = props.content
                return el
            }
        })

        Fold.addComponent({
            name: "container",
            allowChildren: true,
            props: {
                class: { type: "string" }
            },
            render: ({ props, children }) => {
                const el = document.createElement("div")
                if (props.class) el.className = props.class

                children?.forEach(child => el.appendChild(child))
                return el
            }
        })

        const schema = {
            id: "root",
            type: "container",
            props: { class: "page" },
            children: [
                {
                    id: "t1",
                    type: "text",
                    props: { content: "Hello FoldUI" }
                }
            ]
        }

        const html = Fold.render(schema)

        const containerEl = document.getElementById('container')
        containerEl.appendChild(html)

    </script>

</body>

</html>
