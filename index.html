<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldUI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

</head>

<body>

    <div id="container"></div>

    <script type="module">

        import { Fold } from './src/index'

        const rightArrowIcon = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/></svg>'
        const plusIcon = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>'

        const schema = {
            id: 's1',
            type: 'section',
            style: {
                section: {
                    background: 'lightcyan',
                }
            },
            children: [
                {
                    id: 'c1',
                    type: 'container',
                    props: {
                        layout: {
                            type: 'grid',
                            columns: 2,
                            gap: 100,
                        },
                    },
                    style: {
                        container: {
                            maxWidth: '1200px',
                            width: '100%',
                            margin: '0 auto'
                        }
                    },
                    children: [
                        {
                            id: 'c2',
                            type: 'container',
                            props: {
                                layout: {
                                    type: 'flex',
                                    direction: 'vertical',
                                    align: 'flex-start',
                                    justify: 'center',
                                },
                            },
                            style: {
                                container: {
                                }
                            },
                            children: [
                                {
                                    id: 't1',
                                    type: 'text',
                                    props: {
                                        tag: 'h1',
                                        text: "Schema-driven engine for building web UI"
                                    },
                                    style: {
                                        text: {
                                            fontSize: '30px',
                                            marginBottom: '10px',
                                        }
                                    }
                                },
                                {
                                    id: "b1",
                                    type: 'button',
                                    props: {
                                        text: "Get Started",
                                        icon: {
                                            content: rightArrowIcon,
                                            position: "right",
                                        }
                                    },
                                    style: {
                                        button: {
                                            background: 'purple',
                                            borderRadius: '10px',
                                            padding: '10px 20px',
                                        },
                                    },
                                },
                            ]
                        },
                        {
                            id: 'c3',
                            type: 'container',
                            props: {
                                layout: {
                                    type: 'flex',
                                    direction: 'vertical',
                                },
                            },
                            style: {
                                container: {
                                },
                            },
                            children: [
                                {
                                    id: 'i1',
                                    type: 'image',
                                    props: {
                                        src: "https://images.unsplash.com/photo-1499996860823-5214fcc65f8f"
                                    }
                                },
                            ]
                        },
                    ]
                }
            ],
        }

        Fold.addComponent({
            name: 'main',
            render: ({ props, helper }) => {
                const sectionEl = helper.el('section', 'main')
                return sectionEl
            }
        })

        Fold.addComponent({
            name: 'heading',
            props: {
                title: { type: 'string', default: "Heading" },
            },
            defaultStyle: {
                heading: {

                }
            },
            render: ({ props, helper }) => {
                const headingEl = helper.el('h1', 'heading')
                headingEl.innerText = props.title
                return headingEl
            }
        })

        const builderSchema = {
            type: "fragment",
            children: [
                {
                    type: 'container',
                    responsive: {
                        all: {
                            container: {
                                padding: '100px 0px',
                                maxWidth: 600,
                                margin: '0 auto',
                            }
                        }
                    },
                    children: [
                        {
                            type: "text",
                            props: {
                                content: "danish",
                            },
                            responsive: {
                                all: {
                                    text: {
                                        color: 'red',
                                        fontSize: 50,
                                    }
                                },
                                'max-800': {
                                    text: {
                                        fontSize: 30,
                                    }
                                }
                            }
                        },
                        {
                            type: 'button',
                        }
                    ]
                },
            ]
        }

        Fold.use({
            beforeRender({ node, styleEngine }) {
                const parseMediaKey = (key) => {
                    const minMatch = key.match(/^min-(\d+)$/)
                    if (minMatch) return `(min-width: ${minMatch[1]}px)`

                    const maxMatch = key.match(/^max-(\d+)$/)
                    if (maxMatch) return `(max-width: ${maxMatch[1]}px)`

                    return null
                }

                const responsive = node?.responsive
                if (!responsive || !styleEngine) return

                for (const media in responsive) {
                    const config = responsive[media]

                    for (const part in config) {
                        const styleObj = config[part]
                        if (!styleObj) continue

                        const selector = `[data-fui-id="${node.id}"][data-part="${part}"]`

                        if (media === 'all') {
                            styleEngine.push(selector, styleObj)
                        } else {
                            const mediaQuery = parseMediaKey(media)
                            if (!mediaQuery) continue

                            styleEngine.push(selector, styleObj, mediaQuery)
                        }
                    }
                }
            }
        })

        const html = Fold.render(builderSchema)

        const containerEl = document.getElementById('container')
        containerEl.appendChild(html)

    </script>

</body>

</html>
