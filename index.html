<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldUI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

</head>

<body>

    <div id="container"></div>

    <script type="module">

        import { FoldUI } from './src/index'

        const containerEl = document.getElementById('container')

        export const schema = {
            type: 'container',
            props: {
                layout: {
                    type: 'flex',
                    direction: 'column',
                    gap: 16
                }
            },
            children: [

                // ─── HEADER ──────────────────────────────

                {
                    type: 'container',
                    props: {
                        layout: {
                            type: 'flex',
                            justify: 'space-between',
                            align: 'center'
                        }
                    },
                    children: [
                        {
                            type: 'image',
                            props: {
                                src: 'https://ww1.oswego.edu/sites/default/files/styles/4x3_medium/public/2025-01/IMG_0588.jpg?h=71976bb4&itok=XkB2ksAk',
                                alt: 'FoldUI'
                            }
                        },
                        {
                            type: 'list',
                            props: {
                                variant: 'horizontal'
                            },
                            children: [
                                {
                                    type: 'list-item',
                                    props: { href: '/' },
                                    children: [{
                                        type: 'text',
                                        props: {
                                            tag: 'p',
                                            content: 'Home'
                                        }
                                    }]
                                },
                                {
                                    type: 'list-item',
                                    props: { href: '/docs' },
                                    children: [{
                                        type: 'text', props: {
                                            tag: 'p',
                                            content: 'Docs'
                                        }
                                    }]
                                },
                                {
                                    type: 'list-item',
                                    props: { href: '/about' },
                                    children: [{
                                        type: 'text', props: {
                                            tag: 'p',
                                            content: 'About'
                                        }
                                    }]
                                }
                            ]
                        }
                    ]
                },

                // ─── HERO CONTENT ─────────────────────────

                {
                    type: 'container',
                    props: {
                        layout: {
                            type: 'flex',
                            direction: 'column',
                            align: 'center',
                            gap: 8
                        }
                    },
                    children: [
                        {
                            id: 'danish-id',
                            type: 'text',
                            props: {
                                tag: 'h1',
                                content: 'Build UI by folding blocks, not writing markup.'
                            },
                            style: {
                                fontSize: '50px'
                            }
                        },
                        {
                            type: 'fragment',
                            children: [
                                {
                                    type: 'text',
                                    props: {
                                        tag: 'p',
                                        content: 'FoldUI is'
                                    }
                                },
                                {
                                    type: 'text',
                                    props: {
                                        tag: 'p',
                                        content: 'simple, composable, and fast.'
                                    }
                                }
                            ]
                        }
                    ]
                }
            ]
        }


        FoldUI.render(containerEl, schema)

    </script>

</body>

</html>
