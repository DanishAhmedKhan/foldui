<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldUI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

</head>

<body>

    <div id="container"></div>

    <script type="module">

        import { Fold } from './src/index'

        Fold.addComponent({
            name: "section",
            props: {
                tag: { type: "string", default: "section" },
            },
            defaultStyle: {
                padding: '100px 0px'
            },
            render: ({ props }) => {
                const tag = props.tag
                const el = document.createElement(tag)
                return el

            }
        })

        Fold.addComponent({
            name: "text",
            props: {
                tag: { type: "string", default: "span" },
                content: { type: "string", default: "This is a text" }
            },
            defaultStyle: {
                fontSize: '16px',
                color: '#333',
            },
            render: ({ props }) => {
                const tag = props.tag
                const el = document.createElement(tag)
                el.textContent = props.content
                return el
            }
        })

        Fold.addComponent({
            name: "button",
            props: {
                label: { type: "string", default: "Button" }
            },
            defaultStyle: {
                fontSize: '18px',
                padding: '8px 16px',
                background: 'blue',
                border: 'none',
                outline: 'none',
                color: 'white',
                borderRadius: '10px',
                cursor: 'pointer',
            },
            render: ({ props }) => {
                const el = document.createElement("button")
                el.textContent = props.label
                return el
            }
        })

        Fold.addComponent({
            name: "image",
            props: {
                src: { type: "string", default: "" },
                alt: { type: "string", default: "alt" }
            },
            defaultStyle: {
                width: '100%',
            },
            render: ({ props }) => {
                const el = document.createElement("img")
                el.src = props.src
                el.alt = props.alt
                return el
            }
        })

        Fold.addComponent({
            name: "container",
            props: {
                layout: {
                    type: "object",
                    defaultVariant: "flex",
                    variants: {
                        flex: {
                            direction: { type: "string", default: "horizontal" },
                            align: { type: "string", default: "flex-start" },
                            justify: { type: "string", default: "center" }
                        },
                        grid: {
                            columns: { type: "number", default: 3 },
                            gap: { type: "number", default: 10 }
                        }
                    }
                },
                size: {
                    width: { type: "string", default: "1200px" },
                    maxWidth: { type: "string", default: "1200px" },
                },
            },
            render: ({ props, children }) => {
                const el = document.createElement("div")

                const layout = props.layout

                if (layout?.type === "flex") {
                    el.style.display = "flex"

                    el.style.flexDirection =
                        layout.direction === "vertical" ? "column" : "row"

                    el.style.alignItems = layout.align

                    el.style.justifyContent = layout.justify
                }

                if (layout?.type === "grid") {
                    el.style.display = "grid"
                    el.style.gridTemplateColumns = `repeat(${layout.columns}, 1fr)`
                    el.style.gap = `${layout.gap}px`
                }

                return el
            }
        })

        const schema = {
            type: 'section',
            style: {
                background: '#eeebff',
            },
            children: [
                {
                    id: "root",
                    type: "container",
                    props: {
                        layout: {
                            type: 'flex',
                            // clumn: 2,
                            // gap: 50
                        }
                    },
                    style: {
                        margin: '0 auto',
                        width: '100%',
                        maxWidth: '1200px'
                    },
                    children: [
                        {
                            id: 'asdg',
                            type: 'container',
                            props: {
                                layout: {
                                    type: 'flex',
                                    direction: 'vertical',
                                    justify: 'center',
                                    align: 'flex-start',
                                }
                            },
                            children: [
                                {
                                    id: "t1",
                                    type: "text",
                                    props: {
                                        content: "The best amazing menu builder that converts and is well structured. Analytics and SEO included.",
                                        tag: 'h1',
                                    },
                                    style: {
                                        fontSize: '20px',
                                        marginBottom: '30px'
                                    }
                                },
                                {
                                    id: "b1",
                                    type: "button",
                                    props: { label: "Click Me!" },
                                },
                            ]
                        },
                        {
                            id: 'jvoiwe',
                            type: 'container',
                            children: [
                                {
                                    id: "i1",
                                    type: "image",
                                    props: {
                                        src: "https://www.lamborghini.com/sites/it-en/files/DAM/lamborghini/news/2026/01_23_alps/cover.jpg",
                                        alt: 'car'
                                    },
                                },
                            ]
                        },

                    ]
                }
            ],
        }

        const schema2 = {
            type: 'button',
            prop: {
                layout: {
                    type: 'flex',
                    direction: 'horizontal'
                }
            },
            style: {
                container: {
                    width: '100%'
                },
                row: {
                    width: '1200px'
                },
            },
            responsive: {
                mobile: {
                    style: {
                        row: {
                            width: '400px'
                        }
                    },
                    prop: {
                        layout: {
                            direction: 'vertical'
                        }
                    }
                }
            }
        }

        const html = Fold.render(schema2)

        const containerEl = document.getElementById('container')
        containerEl.appendChild(html)

    </script>

</body>

</html>
