<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldUI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

</head>

<body>

    <div id="container"></div>

    <script type="module">

        import { FoldUI, FoldUIDocument } from './src/index'

        const containerEl = document.getElementById('container')

        export const schema = {
            type: 'section',
            props: {
                layout: {
                    type: 'flex',
                    direction: 'column',
                    gap: 16
                }
            },
            children: [
                {
                    type: 'container',
                    props: {
                        layout: {
                            type: 'flex',
                            justify: 'start',
                            align: 'start'
                        },
                        size: {
                            width: 'content',
                            maxWidth: '1200px',
                            center: true,
                        },
                    },
                    children: [
                        {
                            type: 'list',
                            props: {
                                variant: 'vertical'
                            },
                            children: [
                                {
                                    type: 'list-item',
                                    props: { href: '/' },
                                    children: [{
                                        type: 'text',
                                        props: {
                                            tag: 'p',
                                            content: 'Home'
                                        },
                                        style: {
                                            fontSize: '20px',
                                        },
                                    }]
                                },
                                {
                                    type: 'list-item',
                                    props: { href: '/docs' },
                                    children: [{
                                        type: 'text', props: {
                                            tag: 'p',
                                            content: 'Docs'
                                        },
                                        style: {
                                            fontSize: '20px',
                                        },
                                    }]
                                },
                                {
                                    type: 'list-item',
                                    props: { href: '/about' },
                                    children: [{
                                        type: 'text', props: {
                                            tag: 'p',
                                            content: 'About'
                                        },
                                        style: {
                                            fontSize: '20px',
                                        },
                                    }]
                                }
                            ]
                        },
                        {
                            type: 'list',
                            props: {
                                variant: 'vertical'
                            },
                            children: [
                                {
                                    type: 'list-item',
                                    props: { href: '/' },
                                    children: [{
                                        type: 'text',
                                        props: {
                                            tag: 'p',
                                            content: 'Home'
                                        },
                                        style: {
                                            fontSize: '20px',
                                        },
                                    }]
                                },
                                {
                                    type: 'list-item',
                                    props: { href: '/docs' },
                                    children: [{
                                        type: 'text', props: {
                                            tag: 'p',
                                            content: 'Docs'
                                        },
                                        style: {
                                            fontSize: '20px',
                                        },
                                    }]
                                },
                                {
                                    type: 'list-item',
                                    props: { href: '/about' },
                                    children: [{
                                        type: 'text', props: {
                                            tag: 'p',
                                            content: 'About'
                                        },
                                        style: {
                                            fontSize: '20px',
                                        },
                                    }]
                                }
                            ]
                        },
                    ]
                },
            ]
        }


        const schema2 = {
            type: 'container',
            props: {
                layout: {
                    type: 'flex',
                    direction: 'column',
                    gap: 16
                }
            },
            children: [
                {
                    type: 'text',
                    props: {
                        tag: 'p',
                        content: 'About'
                    },
                    style: {
                        fontSize: '40px'
                    }
                },
                {
                    type: 'container',
                    props: {
                        layout: {
                            type: 'flex',
                            direction: 'column',
                            align: 'center',
                            gap: 8
                        }
                    },
                    children: [
                        {
                            id: 'danish-id',
                            type: 'text',
                            props: {
                                tag: 'h1',
                                content: 'Build UI by folding blocks, not writing markup.'
                            },
                            style: {
                                fontSize: '40px'
                            }
                        },
                        {
                            type: 'fragment',
                            children: [
                                {
                                    type: 'text',
                                    props: {
                                        tag: 'p',
                                        content: 'FoldUI is'
                                    }
                                },
                                {
                                    type: 'text',
                                    props: {
                                        tag: 'p',
                                        content: 'simple, composable, and fast.'
                                    }
                                },
                                {
                                    type: 'button',
                                    props: {
                                        label: 'Button',
                                    }
                                }
                            ]
                        }
                    ]
                }
            ]
        }

        FoldUI.render(containerEl, {
            version: '1',
            root: schema
        })


        const doc = new FoldUIDocument()

        const sectionId = doc.add('section').into(doc.getRootId())

        const containerId = doc
            .add('container', { layout: { type: 'flex' } })
            .into(sectionId)

        doc.add('text', { content: 'Hello FoldUI' }).into(containerId)
        doc.add('button', { label: 'Click me' }).into(containerId)

        console.log(doc.getSchema())
        console.log(doc.toRenderSchema())

    </script>

</body>

</html>
